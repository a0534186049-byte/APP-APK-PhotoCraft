name: Build PhotoCraft Android

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Release publishes the signed APK to the fixed GitHub Release; debug is for testing only"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  android:
    uses: a0534186049-byte/ArtCraft-Android-Common/.github/workflows/build-android-app.yml@031af13f6ed8ae4792f58ac4ccb27f299a87cff4
    with:
      app: photocraft
      common_ref: 031af13f6ed8ae4792f58ac4ccb27f299a87cff4
      source_version: stable
      build_mode: ${{ inputs.build_mode || 'debug' }}
      builder_ref: 2a03bb11c4d08e8ca3a5c96dc9fd942cbe7c29a9
    secrets: inherit
